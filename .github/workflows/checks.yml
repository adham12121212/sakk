name: Checks

# Analyzer and tests on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      # .env isn't in git (it holds per-project keys, all public: it ships
      # inside the app), but pubspec lists it as an asset; an empty one lets
      # the app build for tests.
      - name: Create empty .env
        run: touch .env

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
