name: sakk
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  supabase_flutter: ^2.16.0
  get_it: ^9.2.1
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  internet_connection_checker_plus: ^3.1.1
  go_router: ^17.3.0
  flutter_screenutil: ^5.9.3
  image_picker: ^1.2.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  share_plus: ^13.3.0
  http: ^1.6.0
  path_provider: ^2.1.6
  gal: ^2.3.0
  local_auth: ^2.3.0
  google_sign_in: ^7.2.0
  skeletonizer:
  firebase_core: ^4.15.0
  sentry_flutter: ^8.14.2
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  generate: true

  assets:
    - .env
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/icons/app_icon_1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#4A5CFA"
  adaptive_icon_foreground: "assets/icons/android_adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icons/android_monochrome.png"
  # Artwork is already inside the 66dp safe zone; the default 16% inset would shrink it again.
  adaptive_icon_foreground_inset: 0

# Native launch screen. The logo is a 288dp/pt canvas on every platform
# (Android 12+ splash icon size), matched exactly by SplashView in Flutter.
# The generator treats the source as 4x on both platforms: 1152px = 288dp/pt.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#4A5CFA"
  color_dark: "#4A5CFA"
  image: assets/splash/splash_logo.png
  image_dark: assets/splash/splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/splash/splash_logo.png
    image_dark: assets/splash/splash_logo.png
    color: "#4A5CFA"
    color_dark: "#4A5CFA"
